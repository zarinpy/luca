[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luca"
version = "0.1.0"
description = "Server-rendered application using FastAPI and Mako"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.15",
    "babel>=2.17",
    "fastapi>=0.115",
    "mako>=1.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.9",
    "python-dotenv>=1.1",
    "sqlalchemy>=2.0",
    "typer>=0.15",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
]

[project.scripts]
luca = "luca.cli:main"

[tool.setuptools.packages.find]
include = ["luca*"]

[tool.setuptools.package-data]
luca = [
    "templates/*.mako",
    "i18n/babel.cfg",
    "i18n/messages.pot",
    "i18n/*/LC_MESSAGES/*.po",
    "i18n/*/LC_MESSAGES/*.mo",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"
line_length = 79
known_first_party = ["luca"]

[tool.ruff]
line-length = 79
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["ALL"]
extend-ignore = [
    "E902",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D415",
    "D400",
    "D203",
    "D212",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"luca/basedata.py" = ["T201"]
"luca/**/basedata.py" = ["T201"]
"luca/mockup.py" = ["T201"]
"luca/**/mockup.py" = ["T201"]
